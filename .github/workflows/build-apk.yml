name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استيراد الكود (Checkout Repository)
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة جافا (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 إعداد بيئة أندرويد (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 🟢 إعداد Node.js (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 تثبيت حزم المشروع (Install Dependencies)
        run: npm install

      - name: 🏗️ بناء واجهة التطبيق (Build Web Assets)
        run: npm run build

      - name: 🔄 مزامنة منصة أندرويد عبر Capacitor (Capacitor Android Sync)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 منح صلاحيات التنفيذ لـ Gradle
        run: chmod +x android/gradlew

      - name: ⚙️ بناء ملف التطبيق APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف الـ APK وتجهيزه للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LectureVault-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📋 عرض مسار الملف النهائي
        run: |
          echo "✅ تم بناء ملف الـ APK بنجاح!"
          ls -la android/app/build/outputs/apk/debug/
